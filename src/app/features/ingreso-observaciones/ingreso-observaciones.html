<app-modulo-layout titulo="OBSERVACIONES" subtitulo="Gestión de observaciones asociadas al ingreso">

  <div acciones class="app-actions observaciones-header-actions">

    <div class="filtro-observaciones" *ngIf="!mostrarFormulario">

      <mat-icon>filter_list</mat-icon>

      <mat-form-field appearance="outline">

        <mat-label>Filtrar observaciones</mat-label>

        <mat-select [(ngModel)]="filtroCategoria" (selectionChange)="aplicarFiltro()">

          <mat-option value="TODAS">
            Todas las categorías
          </mat-option>

          <mat-option value="GENERAL">GENERAL</mat-option>
          <mat-option value="MEDICA">MEDICA</mat-option>
          <mat-option value="ADMINISTRATIVA">ADMINISTRATIVA</mat-option>

        </mat-select>

      </mat-form-field>

    </div>

    <button *ngIf="!mostrarFormulario" mat-flat-button color="primary" (click)="abrirFormulario()">

      <mat-icon>add</mat-icon>
      Nueva observación

    </button>

  </div>






  <!-- FORMULARIO -->
  <div class="app-form-card nueva-observacion-card" *ngIf="mostrarFormulario">

    <div class="app-form-header">

      <h3>Nueva observación</h3>

      <div class="acciones">

        <button mat-stroked-button (click)="cerrarFormulario()">

          Cancelar

        </button>

        <button mat-flat-button color="primary" (click)="crearObservacion()">

          <mat-icon>save</mat-icon>
          Guardar observación

        </button>

      </div>

    </div>

    <textarea class="observacion-textarea" [(ngModel)]="nuevaObservacion.descripcion"
      placeholder="Escribir observación...">
      </textarea>

    <div class="form-footer">

      <mat-form-field appearance="outline">

        <mat-label>Tipo de observación</mat-label>

        <mat-select [(ngModel)]="nuevaObservacion.tipoObservacion">

          <mat-option *ngFor="let tipo of tiposObservacion" [value]="tipo">

            {{ tipo }}

          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>

  </div>


  <div class="app-section-header">

    <span class="app-section-counter">

      {{ observacionesFiltradas.length }} observación(es)

    </span>

  </div>

  <!-- LISTADO -->

  <div class="app-list" *ngIf="observacionesFiltradas.length > 0; else sinObservaciones">

    <div *ngFor="let observacion of observacionesFiltradas">

      <app-observacion-item [observacion]="observacion" [expandido]="observacion.expandido"
        (toggle)="toggleObservacion(observacion)">

      </app-observacion-item>

    </div>

  </div>



  <ng-template #sinObservaciones>

    <div class="app-empty-state">

      <mat-icon>chat</mat-icon>

      <p>
        No hay observaciones registradas para este ingreso.
      </p>

    </div>

  </ng-template>


  <!-- </div> -->

</app-modulo-layout>
